name: Import verified publication bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Import exact verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL -o import.tar.gz "https://github.com/rn-collins/ask-a-neuroscientist-fashion/releases/download/codex-import-aan-60bb818/aan-import-60bb818-20260908.tar.gz"
          tar -xzf import.tar.gz
          git init --bare imported.git
          git --git-dir=imported.git fetch "$PWD/aan-visual-audit-60bb818.bundle" HEAD:refs/heads/imported
          git --git-dir=imported.git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" refs/heads/imported:refs/heads/codex-aan-import

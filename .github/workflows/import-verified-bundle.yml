name: Import verified AAN gallery tranche
on:
  push:
    branches: [main]
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Import verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -o aan.bundle "https://github.com/rn-collins/ask-a-neuroscientist-fashion/releases/download/codex-import-aan-gallery-9d97de1/aan-visible-gallery-9d97de1.bundle"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" imported
          cd imported
          git fetch ../aan.bundle refs/heads/codex/aan-visible-gallery:refs/heads/codex-aan-visible-gallery-9d97de1
          test "$(git rev-parse codex-aan-visible-gallery-9d97de1)" = "9d97de112387638895d94c944828dc2befce1b4c"
          test "$(git merge-base codex-aan-visible-gallery-9d97de1 377241d91bf78408de2ad5362b222ba479faffe5)" = "377241d91bf78408de2ad5362b222ba479faffe5"
          git push origin refs/heads/codex-aan-visible-gallery-9d97de1

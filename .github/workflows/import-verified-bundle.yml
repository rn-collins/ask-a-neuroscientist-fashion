name: Import verified AAN route-integrity tranche
on:
  push:
    branches: [main]
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Import verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -o aan.bundle "https://github.com/rn-collins/ask-a-neuroscientist-fashion/releases/download/codex-import-aan-922de31/aan-publication-smoke-rebuilt.bundle"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" imported
          cd imported
          git fetch ../aan.bundle HEAD:refs/heads/codex-aan-publication-922de31
          test "$(git rev-parse codex-aan-publication-922de31)" = "922de31d27c1966379f68cd252cce939af30c607"
          test "$(git rev-parse codex-aan-publication-922de31^)" = "1a3812e14005e4f3db00340f8ac659926f5ad5bd"
          git push origin refs/heads/codex-aan-publication-922de31

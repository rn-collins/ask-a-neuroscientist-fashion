name: Import verified AAN runtime metadata
on:
  push:
    branches: [main]
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Import verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -o aan.bundle "https://github.com/rn-collins/ask-a-neuroscientist-fashion/releases/download/codex-import-aan-runtime-43a6cf1/aan-runtime-metadata-43a6cf1.bundle"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" imported
          cd imported
          git fetch ../aan.bundle refs/heads/codex/aan-runtime-metadata:refs/heads/codex-aan-runtime-metadata-43a6cf1
          test "$(git rev-parse codex-aan-runtime-metadata-43a6cf1)" = "43a6cf1e1a603530be3bc5068509ff48c827de5b"
          test "$(git rev-parse codex-aan-runtime-metadata-43a6cf1^)" = "9d97de112387638895d94c944828dc2befce1b4c"
          git push origin refs/heads/codex-aan-runtime-metadata-43a6cf1

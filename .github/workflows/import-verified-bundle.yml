name: Import verified AAN media tranche
on:
  push:
    branches: [main]
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import verified commits
        run: |
          set -euo pipefail
          curl -fL -o aan.bundle "https://github.com/rn-collins/ask-a-neuroscientist-fashion/releases/download/codex-import-aan-c29da3c/aan-media-c29da3c.bundle"
          git fetch ./aan.bundle HEAD:refs/heads/codex-aan-media
          git push --force origin refs/heads/codex-aan-media
